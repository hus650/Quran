<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تسميع القرآن الكريم التفاعلي المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --word-hidden-bg: #334155;
            --word-revealed-color: #fef08a;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { 
            font-size: 28px; 
            color: var(--text-light); 
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            font-size: 17px;
            font-family: 'Amiri', serif;
            background: #0f172a;
            color: var(--text-light);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-gold);
        }

        .quran-container {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            padding: 35px;
            border-radius: 16px;
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            line-height: 2.8;
            text-align: justify;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 25px;
            scroll-behavior: smooth;
            word-spacing: 4px;
        }

        /* MAT & ŞIK KELİME TASARIMI */
        .q-word {
            display: inline-block;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            filter: blur(8px);
            opacity: 0.15;
            user-select: none;
            background-color: var(--word-hidden-bg);
            border-radius: 6px;
            padding: 0 6px;
            margin: 0 2px;
            color: var(--text-light);
        }

        .q-word.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background-color: transparent;
            color: var(--word-revealed-color);
        }

        .verse-num {
            display: inline-block;
            color: var(--accent-gold);
            font-size: 22px;
            margin: 0 10px;
            opacity: 0.8;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Amiri', serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-start { background: var(--accent-gold); color: #fff; }
        .btn-start:hover:not(:disabled) { background: var(--accent-gold-hover); }
        .btn-stop { background: var(--danger); color: #fff; }
        .btn-stop:hover:not(:disabled) { opacity: 0.9; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .status-badge {
            display: none;
            text-align: center;
            color: #f87171;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 20px;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .results-panel {
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 14px;
            background: #0f172a;
            border: 1px solid var(--panel-border);
        }

        .score-display {
            font-size: 48px;
            font-weight: 800;
            color: var(--accent-gold);
            text-align: center;
            font-family: 'Inter', sans-serif;
        }

        .error-tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .error-tag-list li {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 15px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

<div class="main-card">
    <header>
        <h1>تطبيق تسميع القرآن الكريم التفاعلي المباشر</h1>
    </header>

    <div class="control-grid">
        <div class="form-group">
            <label for="surahSelect">اختر السورة المباركة:</label>
            <select id="surahSelect" onchange="QuranApp.onSurahChanged()">
                <option value="">جاري تحميل السور...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="startAyahSelect">ابدأ من الآية:</label>
            <select id="startAyahSelect" onchange="QuranApp.renderText()">
                <option value="1">1</option>
            </select>
        </div>
    </div>

    <div class="quran-container" id="quranText">
        الرجاء اختيار سورة من القائمة للبدء...
    </div>

    <div class="status-badge" id="statusIndicator">
        🔴 جاري الاستماع... اتلُ الآيات بالترتيب (يمكنك التكرار بحرية)
    </div>

    <div class="action-bar">
        <button id="startBtn" class="btn btn-start" onclick="QuranApp.startRecitation()" disabled>
            <i class="fa-solid fa-microphone"></i> <span>ابدأ التسميع</span>
        </button>
        <button id="stopBtn" class="btn btn-stop" onclick="QuranApp.stopRecitation()" disabled>
            <i class="fa-solid fa-square"></i> <span>إنهاء والتقييم النهائي</span>
        </button>
    </div>

    <div class="results-panel" id="resultsPanel">
        <div class="score-display" id="scoreDisplay">%0</div>
        <div class="feedback-text" id="feedbackDisplay" style="text-align:center; font-weight:600; margin-top:10px; color: var(--text-muted);"></div>
        <h4 style="margin-top:15px; font-size: 16px; color: var(--text-light);">الكلمات التي تحتاج إلى مراجعة:</h4>
        <ul id="errorList" class="error-tag-list"></ul>
    </div>
</div>

<script>
const QuranApp = (function() {
    let state = {
        surahAyahs: [],
        isListening: false,
        fullTranscribedSpeech: "",
        wordsMap: [],
        currentIndex: 0, // SIKI SIRALI TAKİP İNDEKSİ (IŞINLANMAYI ÖNLER)
        recognitionInstance: null
    };

    function normalizeArabic(text) {
        if (!text) return "";
        return text
            .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
            .replace(/[﴿﴾0-9\(\)\[\]\{\}\.\,\;\:\-\_\"\']/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'ء')
            .replace(/ئ/g, 'ء')
            .replace(/ة/g, 'ه')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function isWordMatch(w1, w2) {
        if (!w1 || !w2) return false;
        if (w1 === w2) return true;
        if (Math.abs(w1.length - w2.length) > 2) return false;
        
        let matches = 0;
        const minLen = Math.min(w1.length, w2.length);
        for (let i = 0; i < minLen; i++) {
            if (w1[i] === w2[i]) matches++;
        }
        return (matches / Math.max(w1.length, w2.length)) >= 0.70;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("المتصفح لا يدعم التسميع الصوتي المباشر.");
            return;
        }

        state.recognitionInstance = new SpeechRecognition();
        state.recognitionInstance.continuous = true;
        state.recognitionInstance.interimResults = true;
        state.recognitionInstance.lang = 'ar-SA';

        state.recognitionInstance.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    state.fullTranscribedSpeech += ' ' + event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            const currentLiveText = state.fullTranscribedSpeech + ' ' + interimTranscript;
            processControlledSequentialMatching(currentLiveText);
        };

        state.recognitionInstance.onend = () => {
            if (state.isListening) {
                try { state.recognitionInstance.start(); } catch(e){}
            }
        };
    }

    /**
     * KONTROLLÜ SIRALI AÇMA (İLERİ SIÇRAMA VE IŞINLANMA ENGELLENDİ)
     */
    function processControlledSequentialMatching(speechText) {
        const cleanSpeech = normalizeArabic(speechText);
        if (!cleanSpeech) return;

        const spokenWords = cleanSpeech.split(' ').filter(w => w.length > 0);
        if (spokenWords.length === 0) return;

        const recentSpoken = spokenWords.slice(-5);

        // Sadece mevcut konumdan maksimum 3 kelime sonrasına bakılır
        let maxSearchIndex = Math.min(state.currentIndex + 3, state.wordsMap.length);

        for (let i = state.currentIndex; i < maxSearchIndex; i++) {
            const item = state.wordsMap[i];
            if (!item || item.isRevealed) continue;

            const matched = recentSpoken.some(spkWd => isWordMatch(item.cleanWord, spkWd));

            if (matched) {
                // Sadece bulunulan kelimeyi ve aradaki küçük atlamayı aç
                for (let k = state.currentIndex; k <= i; k++) {
                    if (state.wordsMap[k] && !state.wordsMap[k].isRevealed) {
                        state.wordsMap[k].isRevealed = true;
                        state.wordsMap[k].element.classList.add('revealed');
                    }
                }

                state.currentIndex = i + 1;
                item.element.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                break;
            }
        }
    }

    async function fetchSurahList() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            const selectEl = document.getElementById('surahSelect');
            selectEl.innerHTML = '<option value="">-- اختر السورة المباركة --</option>';
            data.data.forEach(surah => {
                selectEl.innerHTML += `<option value="${surah.number}">${surah.number}. سورة ${surah.name}</option>`;
            });
        } catch (e) {
            alert('خطأ في تحميل السور.');
        }
    }

    return {
        init: function() {
            initSpeechRecognition();
            fetchSurahList();
        },

        onSurahChanged: async function() {
            const surahNum = document.getElementById('surahSelect').value;
            if (!surahNum) return;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
                const data = await res.json();
                state.surahAyahs = data.data.ayahs;

                const startSelect = document.getElementById('startAyahSelect');
                startSelect.innerHTML = '';
                state.surahAyahs.forEach(a => {
                    startSelect.innerHTML += `<option value="${a.numberInSurah}">الآية ${a.numberInSurah}</option>`;
                });

                this.renderText();
                document.getElementById('startBtn').disabled = false;
            } catch (e) {
                alert('خطأ في تحميل نص السورة.');
            }
        },

        renderText: function() {
            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const quranContainer = document.getElementById('quranText');
            quranContainer.innerHTML = '';

            state.wordsMap = [];
            state.currentIndex = 0;

            state.surahAyahs.forEach(ayah => {
                const isBeforeStart = ayah.numberInSurah < startAyah;
                const rawWords = ayah.text.split(/\s+/);

                rawWords.forEach(w => {
                    const cleanW = normalizeArabic(w);
                    const wordSpan = document.createElement('span');
                    wordSpan.className = `q-word ${isBeforeStart ? 'revealed' : ''}`;
                    wordSpan.innerText = w;
                    
                    quranContainer.appendChild(wordSpan);

                    if (!isBeforeStart) {
                        state.wordsMap.push({
                            cleanWord: cleanW,
                            element: wordSpan,
                            isRevealed: false
                        });
                    }
                });

                const ayahNumSpan = document.createElement('span');
                ayahNumSpan.className = 'verse-num';
                ayahNumSpan.innerText = ` ﴿${ayah.numberInSurah}﴾ `;
                quranContainer.appendChild(ayahNumSpan);
            });
        },

        startRecitation: function() {
            if (!state.recognitionInstance) return;

            state.fullTranscribedSpeech = "";
            state.isListening = true;

            document.getElementById('resultsPanel').style.display = 'none';
            document.getElementById('statusIndicator').style.display = 'block';

            try { state.recognitionInstance.start(); } catch(e){}

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('surahSelect').disabled = true;
            document.getElementById('startAyahSelect').disabled = true;
        },

        stopRecitation: async function() {
            state.isListening = false;
            if (state.recognitionInstance) state.recognitionInstance.stop();

            document.getElementById('statusIndicator').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('surahSelect').disabled = false;
            document.getElementById('startAyahSelect').disabled = false;

            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const relevantAyahs = state.surahAyahs.filter(a => a.numberInSurah >= startAyah);
            const originalText = relevantAyahs.map(a => a.text).join(' ');

            try {
                const res = await fetch('/api/analyze-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        originalText: originalText,
                        transcribedText: state.fullTranscribedSpeech
                    })
                });

                const result = await res.json();
                if (result.success) {
                    this.displayResults(result.data);
                }
            } catch (e) {
                alert('حدث خطأ أثناء التقييم.');
            }
        },

        displayResults: function(data) {
            document.getElementById('scoreDisplay').innerText = `%${data.accuracy_percentage}`;
            document.getElementById('feedbackDisplay').innerText = data.feedback_ar;

            const errorList = document.getElementById('errorList');
            errorList.innerHTML = '';

            if (data.missing_or_wrong_words && data.missing_or_wrong_words.length > 0) {
                data.missing_or_wrong_words.forEach(word => {
                    const li = document.createElement('li');
                    li.innerText = word;
                    errorList.appendChild(li);
                });
            } else {
                errorList.innerHTML = '<li style="background:rgba(34,197,94,0.15); color:#86efac; border-color:rgba(34,197,94,0.3);">ما شاء الله! التلاوة ممتازة ومتقنة للغاية.</li>';
            }

            document.getElementById('resultsPanel').style.display = 'block';
        }
    };
})();

window.addEventListener('DOMContentLoaded', () => {
    QuranApp.init();
});
</script>
</body>
</html>
