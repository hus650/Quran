<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة التسميع التفاعلي المباشر</title>
    
    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BS0LYX8BTM');
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(18, 26, 47, 0.95);
            --border-color: rgba(212, 163, 38, 0.2);
            --border-hover: rgba(212, 163, 38, 0.5);
            --gold-accent: #d4a326;
            --gold-glow: rgba(212, 163, 38, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --word-blur-bg: #1e293b;
            --word-revealed: #ffe082;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 163, 38, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* SABİT SOL SIDEBAR (TÜM SURELER) */
        .kuran-sidebar-panel {
            width: 280px;
            height: 100vh;
            background: #080c17;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            right: 0; /* RTL düzeninde sağ tarafta sabit durur */
            z-index: 100;
        }

        .sidebar-panel-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(18, 26, 47, 0.6);
            text-align: center;
        }

        .sidebar-panel-header h2 {
            font-family: 'Amiri Quran', serif;
            color: var(--gold-accent);
            font-size: 24px;
            font-weight: 400;
        }

        .sidebar-panel-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .surah-list {
            list-style: none;
        }

        .surah-item {
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 10px;
            background: rgba(18, 26, 47, 0.4);
            border: 1px solid transparent;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .surah-item:hover, .surah-item.active {
            background: var(--gold-glow);
            border-color: var(--gold-accent);
            color: var(--gold-accent);
        }

        .surah-num {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* ANA UYGULAMA ALANI */
        .main-wrapper {
            margin-right: 280px; /* Sidebar kadar pay bırakır */
            flex: 1;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
        }

        /* HEADER SECTION */
        header { text-align: center; margin-bottom: 28px; }
        .title-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--gold-glow);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--gold-accent);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        header h1 {
            font-size: 30px;
            color: var(--text-primary);
            font-weight: 700;
        }

        /* QURAN DISPLAY CONTAINER */
        .quran-viewport {
            background: #080c17;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 32px 24px;
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            line-height: 2.7;
            text-align: justify;
            max-height: 450px;
            overflow-y: auto;
            margin-bottom: 24px;
            word-spacing: 3px;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        /* KELİME STİLLERİ (GİZLİ/AÇIK) */
        .q-word {
            display: inline-block;
            transition: filter 0.3s ease, opacity 0.3s ease;
            filter: blur(9px);
            opacity: 0.12;
            user-select: none;
            background: var(--word-blur-bg);
            border-radius: 6px;
            padding: 0 6px;
            margin: 0 2px;
            cursor: pointer;
        }

        .q-word.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background: transparent;
            color: var(--word-revealed);
            text-shadow: 0 0 10px rgba(255, 224, 130, 0.2);
        }

        .verse-num {
            display: inline-block;
            color: var(--gold-accent);
            font-size: 22px;
            margin: 0 8px;
            opacity: 0.85;
        }

        /* BOTON ALANI */
        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 14px;
            font-family: 'Amiri', serif;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #d4a326 0%, #b48310 100%);
            color: #000;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 163, 38, 0.3);
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .kuran-sidebar-panel { width: 100%; height: 200px; position: relative; border-left: none; border-bottom: 1px solid var(--border-color); }
            .main-wrapper { margin-right: 0; padding: 20px 10px; }
        }
    </style>
</head>
<body>

    <!-- SABİT KURAN SURE LİSTESİ SIDEBAR -->
    <aside class="kuran-sidebar-panel">
        <div class="sidebar-panel-header">
            <h2>فهرس السور (Sureler)</h2>
        </div>
        <div class="sidebar-panel-body">
            <ul class="surah-list" id="surahList">
                <li class="surah-item active" data-surah="1">
                    <span>الفاتحة</span>
                    <span class="surah-num">١</span>
                </li>
                <li class="surah-item" data-surah="112">
                    <span>الإخلاص</span>
                    <span class="surah-num">١١٢</span>
                </li>
                <li class="surah-item" data-surah="113">
                    <span>الفلق</span>
                    <span class="surah-num">١١٣</span>
                </li>
                <li class="surah-item" data-surah="114">
                    <span>الناس</span>
                    <span class="surah-num">١١٤</span>
                </li>
            </ul>
        </div>
    </aside>

    <!-- ANA TASMIA OKUMA ALANI -->
    <main class="main-wrapper">
        <div class="app-container">
            <header>
                <span class="title-badge">التسميع التفاعلي</span>
                <h1>منصة التسميع التفاعلي المباشر</h1>
            </header>

            <div class="quran-viewport" id="quranViewport">
                <!-- Tıklanarak açılan kelimeler -->
                <span class="q-word">بِسْمِ</span>
                <span class="q-word">اللَّهِ</span>
                <span class="q-word">الرَّحْمَٰنِ</span>
                <span class="q-word">الرَّحِيمِ</span>
                <span class="verse-num">﴿١﴾</span>
                <span class="q-word">الْحَمْدُ</span>
                <span class="q-word">لِلَّهِ</span>
                <span class="q-word">رَبِّ</span>
                <span class="q-word">الْعَالَمِينَ</span>
                <span class="verse-num">﴿٢﴾</span>
                <span class="q-word">الرَّحْمَٰنِ</span>
                <span class="q-word">الرَّحِيمِ</span>
                <span class="verse-num">﴿٣﴾</span>
                <span class="q-word">مَالِكِ</span>
                <span class="q-word">يَوْمِ</span>
                <span class="q-word">الدِّينِ</span>
                <span class="verse-num">﴿٤﴾</span>
            </div>

            <div class="action-bar">
                <button class="btn btn-start" id="toggleRevealBtn">
                    <i class="fa-solid fa-eye"></i>
                    إظهار / إخفاء الكل (Tümünü Göster / Gizle)
                </button>
            </div>
        </div>
    </main>

    <script>
        // Kelimelere tıklayınca açma/kapatma
        document.querySelectorAll('.q-word').forEach(word => {
            word.addEventListener('click', () => {
                word.classList.toggle('revealed');
            });
        });

        // Tümünü göster/gizle butonu
        const toggleBtn = document.getElementById('toggleRevealBtn');
        let isRevealed = false;

        toggleBtn.addEventListener('click', () => {
            isRevealed = !isRevealed;
            document.querySelectorAll('.q-word').forEach(word => {
                if (isRevealed) {
                    word.classList.add('revealed');
                } else {
                    word.classList.remove('revealed');
                }
            });
        });

        // Sidebar sure seçimi
        document.querySelectorAll('.surah-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.surah-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
