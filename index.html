<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة التسميع التفاعلي المباشر</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(18, 26, 47, 0.95);
            --border-color: rgba(212, 163, 38, 0.2);
            --border-hover: rgba(212, 163, 38, 0.5);
            --gold-accent: #d4a326;
            --gold-glow: rgba(212, 163, 38, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --word-blur-bg: #1e293b;
            --word-revealed: #ffe082;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 163, 38, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }

        /* HEADER SECTION */
        header { text-align: center; margin-bottom: 28px; }
        .title-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--gold-glow);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--gold-accent);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        header h1 {
            font-size: 30px;
            color: var(--text-primary);
            font-weight: 700;
            line-height: 1.3;
        }

        /* CONTROL GRID (MOBILE RESPONSIVE) */
        .control-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .control-grid {
                grid-template-columns: 1fr;
            }
            .app-container {
                padding: 20px 14px;
                border-radius: 18px;
            }
            header h1 { font-size: 24px; }
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Amiri', serif;
            font-size: 18px;
            outline: none;
            transition: all 0.25s ease;
        }

        select:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        /* QURAN DISPLAY CONTAINER */
        .quran-viewport {
            background: #080c17;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 32px 24px;
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            line-height: 2.7;
            text-align: justify;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            word-spacing: 3px;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 640px) {
            .quran-viewport {
                font-size: 22px;
                line-height: 2.4;
                padding: 20px 14px;
                max-height: 350px;
            }
        }

        /* KELİME STİLLERİ */
        .q-word {
            display: inline-block;
            transition: filter 0.3s ease, opacity 0.3s ease, transform 0.2s ease;
            filter: blur(9px);
            opacity: 0.12;
            user-select: none;
            background: var(--word-blur-bg);
            border-radius: 6px;
            padding: 0 6px;
            margin: 0 2px;
        }

        .q-word.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background: transparent;
            color: var(--word-revealed);
            text-shadow: 0 0 10px rgba(255, 224, 130, 0.2);
        }

        .verse-num {
            display: inline-block;
            color: var(--gold-accent);
            font-size: 22px;
            margin: 0 8px;
            opacity: 0.85;
        }

        /* ACTION BUTTONS */
        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 16px 28px;
            border-radius: 14px;
            font-family: 'Amiri', serif;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-start {
            background: linear-gradient(135deg, #d4a326 0%, #b48310 100%);
            color: #000;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(212, 163, 38, 0.3);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #fff;
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(239, 68, 68, 0.3);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* STATUS BADGE */
        .status-badge {
            display: none;
            text-align: center;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* RESULTS PANEL */
        .results-panel {
            display: none;
            margin-top: 24px;
            padding: 28px;
            border-radius: 18px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .score-display {
            font-size: 56px;
            font-weight: 800;
            color: var(--gold-accent);
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin-bottom: 8px;
        }

        .feedback-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .error-tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }

        .error-tag-list li {
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 16px;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <span class="title-badge"><i class="fa-solid fa-kaaba"></i> منصة التسميع الذكية</span>
        <h1>تطبيق تسميع القرآن الكريم التفاعلي</h1>
    </header>

    <div class="control-grid">
        <div class="form-group">
            <label for="surahSelect">اختر السورة المباركة:</label>
            <select id="surahSelect" onchange="QuranApp.onSurahChanged()">
                <option value="">جاري تحميل السور...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="startAyahSelect">ابدأ من الآية:</label>
            <select id="startAyahSelect" onchange="QuranApp.renderText()">
                <option value="1">1</option>
            </select>
        </div>
    </div>

    <div class="quran-viewport" id="quranText">
        الرجاء اختيار سورة من القائمة للبدء...
    </div>

    <div class="status-badge" id="statusIndicator">
        <i class="fa-solid fa-microphone-lines"></i> جاري الاستماع... اتلُ بالترتيب (يمكنك التكرار بحرية)
    </div>

    <div class="action-bar">
        <button id="startBtn" class="btn btn-start" onclick="QuranApp.startRecitation()" disabled>
            <i class="fa-solid fa-microphone"></i> <span>ابدأ التسميع</span>
        </button>
        <button id="stopBtn" class="btn btn-stop" onclick="QuranApp.stopRecitation()" disabled>
            <i class="fa-solid fa-circle-stop"></i> <span>إنهاء والتقييم</span>
        </button>
    </div>

    <div class="results-panel" id="resultsPanel">
        <div class="score-display" id="scoreDisplay">%0</div>
        <div class="feedback-text" id="feedbackDisplay"></div>
        <h4 style="font-size: 16px; color: var(--text-primary); margin-bottom: 8px;">الكلمات التي تحتاج إلى مراجعة:</h4>
        <ul id="errorList" class="error-tag-list"></ul>
    </div>
</div>

<script>
const QuranApp = (function() {
    let state = {
        surahAyahs: [],
        isListening: false,
        fullTranscribedSpeech: "",
        wordsMap: [],
        currentIndex: 0, // KONTROLLÜ SIRALI TAKİP İNDEKSİ (IŞINLANMAYI KESİNLİKLE ENGELLER)
        recognitionInstance: null
    };

    function normalizeArabic(text) {
        if (!text) return "";
        return text
            .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
            .replace(/[﴿﴾0-9\(\)\[\]\{\}\.\,\;\:\-\_\"\']/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'ء')
            .replace(/ئ/g, 'ء')
            .replace(/ة/g, 'ه')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function isWordMatch(w1, w2) {
        if (!w1 || !w2) return false;
        if (w1 === w2) return true;
        if (Math.abs(w1.length - w2.length) > 2) return false;
        
        let matches = 0;
        const minLen = Math.min(w1.length, w2.length);
        for (let i = 0; i < minLen; i++) {
            if (w1[i] === w2[i]) matches++;
        }
        return (matches / Math.max(w1.length, w2.length)) >= 0.65;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("المتصفح لا يدعم التسميع الصوتي المباشر.");
            return;
        }

        state.recognitionInstance = new SpeechRecognition();
        state.recognitionInstance.continuous = true;
        state.recognitionInstance.interimResults = true;
        state.recognitionInstance.lang = 'ar-SA';

        state.recognitionInstance.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    state.fullTranscribedSpeech += ' ' + event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            const currentLiveText = state.fullTranscribedSpeech + ' ' + interimTranscript;
            processControlledSequentialMatching(currentLiveText);
        };

        state.recognitionInstance.onend = () => {
            if (state.isListening) {
                try { state.recognitionInstance.start(); } catch(e){}
            }
        };
    }

    /**
     * KONTROLLÜ VE IŞINLANMAYI ENGELEYEN CANLI EŞLEŞTİRME
     */
    function processControlledSequentialMatching(speechText) {
        const cleanSpeech = normalizeArabic(speechText);
        if (!cleanSpeech) return;

        const spokenWords = cleanSpeech.split(' ').filter(w => w.length > 0);
        if (spokenWords.length === 0) return;

        const recentSpoken = spokenWords.slice(-5);

        // Bulunulan konumdan maksimum 3 kelime ilerisine bakılır (Sıçramalar Engellendi)
        let maxSearchIndex = Math.min(state.currentIndex + 3, state.wordsMap.length);

        for (let i = state.currentIndex; i < maxSearchIndex; i++) {
            const item = state.wordsMap[i];
            if (!item || item.isRevealed) continue;

            const matched = recentSpoken.some(spkWd => isWordMatch(item.cleanWord, spkWd));

            if (matched) {
                for (let k = state.currentIndex; k <= i; k++) {
                    if (state.wordsMap[k] && !state.wordsMap[k].isRevealed) {
                        state.wordsMap[k].isRevealed = true;
                        state.wordsMap[k].element.classList.add('revealed');
                    }
                }

                state.currentIndex = i + 1;
                item.element.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                break;
            }
        }
    }

    async function fetchSurahList() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            const selectEl = document.getElementById('surahSelect');
            selectEl.innerHTML = '<option value="">-- اختر السورة المباركة --</option>';
            data.data.forEach(surah => {
                selectEl.innerHTML += `<option value="${surah.number}">${surah.number}. سورة ${surah.name}</option>`;
            });
        } catch (e) {
            alert('خطأ في تحميل السور.');
        }
    }

    return {
        init: function() {
            initSpeechRecognition();
            fetchSurahList();
        },

        onSurahChanged: async function() {
            const surahNum = document.getElementById('surahSelect').value;
            if (!surahNum) return;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
                const data = await res.json();
                state.surahAyahs = data.data.ayahs;

                const startSelect = document.getElementById('startAyahSelect');
                startSelect.innerHTML = '';
                state.surahAyahs.forEach(a => {
                    startSelect.innerHTML += `<option value="${a.numberInSurah}">الآية ${a.numberInSurah}</option>`;
                });

                this.renderText();
                document.getElementById('startBtn').disabled = false;
            } catch (e) {
                alert('خطأ في تحميل نص السورة.');
            }
        },

        renderText: function() {
            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const quranContainer = document.getElementById('quranText');
            quranContainer.innerHTML = '';

            state.wordsMap = [];
            state.currentIndex = 0;

            state.surahAyahs.forEach(ayah => {
                const isBeforeStart = ayah.numberInSurah < startAyah;
                const rawWords = ayah.text.split(/\s+/);

                rawWords.forEach(w => {
                    const cleanW = normalizeArabic(w);
                    const wordSpan = document.createElement('span');
                    wordSpan.className = `q-word ${isBeforeStart ? 'revealed' : ''}`;
                    wordSpan.innerText = w;
                    
                    quranContainer.appendChild(wordSpan);

                    if (!isBeforeStart) {
                        state.wordsMap.push({
                            cleanWord: cleanW,
                            element: wordSpan,
                            isRevealed: false
                        });
                    }
                });

                const ayahNumSpan = document.createElement('span');
                ayahNumSpan.className = 'verse-num';
                ayahNumSpan.innerText = ` ﴿${ayah.numberInSurah}﴾ `;
                quranContainer.appendChild(ayahNumSpan);
            });
        },

        startRecitation: function() {
            if (!state.recognitionInstance) return;

            state.fullTranscribedSpeech = "";
            state.isListening = true;

            document.getElementById('resultsPanel').style.display = 'none';
            document.getElementById('statusIndicator').style.display = 'block';

            try { state.recognitionInstance.start(); } catch(e){}

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('surahSelect').disabled = true;
            document.getElementById('startAyahSelect').disabled = true;
        },

        stopRecitation: async function() {
            state.isListening = false;
            if (state.recognitionInstance) state.recognitionInstance.stop();

            document.getElementById('statusIndicator').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('surahSelect').disabled = false;
            document.getElementById('startAyahSelect').disabled = false;

            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const relevantAyahs = state.surahAyahs.filter(a => a.numberInSurah >= startAyah);
            const originalText = relevantAyahs.map(a => a.text).join(' ');

            try {
                const res = await fetch('/api/analyze-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        originalText: originalText,
                        transcribedText: state.fullTranscribedSpeech
                    })
                });

                const result = await res.json();
                if (result.success) {
                    this.displayResults(result.data);
                }
            } catch (e) {
                alert('حدث خطأ أثناء التقييم.');
            }
        },

        displayResults: function(data) {
            document.getElementById('scoreDisplay').innerText = `%${data.accuracy_percentage}`;
            document.getElementById('feedbackDisplay').innerText = data.feedback_ar;

            const errorList = document.getElementById('errorList');
            errorList.innerHTML = '';

            if (data.missing_or_wrong_words && data.missing_or_wrong_words.length > 0) {
                data.missing_or_wrong_words.forEach(word => {
                    const li = document.createElement('li');
                    li.innerText = word;
                    errorList.appendChild(li);
                });
            } else {
                errorList.innerHTML = '<li style="background:rgba(34,197,94,0.12); color:#86efac; border-color:rgba(34,197,94,0.25);">ما شاء الله! التلاوة ممتازة ومتقنة للغاية.</li>';
            }

            document.getElementById('resultsPanel').style.display = 'block';
        }
    };
})();

window.addEventListener('DOMContentLoaded', () => {
    QuranApp.init();
});
</script>
</body>
</html>
