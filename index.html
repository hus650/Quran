<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تسميع القرآن الكريم التفاعلي المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-grad-1: #f3e098;
            --bg-grad-2: #d4a326;
            --bg-grad-3: #784e10;
            --panel-bg: rgba(255, 255, 255, 0.97);
            --gold-primary: #c59318;
            --gold-dark: #5c3a08;
            --gold-light: #fffbc8;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
            background-attachment: fixed;
            color: var(--gold-dark);
            min-height: 100vh;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 950px;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 2px solid #e2bd62;
        }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { font-size: 32px; color: var(--gold-dark); font-weight: 700; }

        .control-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 16px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #d1a73e;
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Amiri', serif;
            background: #fffdf5;
            color: var(--gold-dark);
            outline: none;
        }

        .quran-container {
            background: #ffffff;
            border: 2px solid #e2bd62;
            padding: 30px;
            border-radius: 20px;
            font-family: 'Amiri Quran', serif;
            font-size: 30px;
            line-height: 2.6;
            text-align: justify;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 20px;
            scroll-behavior: smooth;
            word-spacing: 2px;
        }

        .q-word {
            display: inline-block;
            transition: filter 0.3s ease, opacity 0.3s ease;
            filter: blur(10px);
            opacity: 0.12;
            user-select: none;
            background-color: var(--gold-light);
            border-radius: 6px;
            padding: 0 4px;
            margin: 0 2px;
        }

        .q-word.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background-color: transparent;
            color: var(--gold-dark);
            animation: wordHighlight 0.4s ease-out;
        }

        @keyframes wordHighlight {
            0% { transform: scale(1.15); background-color: #fce888; }
            100% { transform: scale(1); background-color: transparent; }
        }

        .verse-num {
            display: inline-block;
            color: var(--gold-primary);
            font-size: 24px;
            margin: 0 8px;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            padding: 14px 32px;
            font-size: 19px;
            font-weight: bold;
            font-family: 'Amiri', serif;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn-start { background: var(--gold-primary); color: #fff; }
        .btn-start:hover:not(:disabled) { background: #ab7f11; }
        .btn-stop { background: var(--danger); color: #fff; }
        .btn-stop:hover:not(:disabled) { background: #b91c1c; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .status-badge {
            display: none;
            text-align: center;
            color: var(--danger);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .results-panel {
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 18px;
            background: #fffdf2;
            border: 2px solid #e2bd62;
        }

        .score-display {
            font-size: 54px;
            font-weight: 800;
            color: var(--gold-primary);
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .error-tag-list {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .error-tag-list li {
            background: #fef2f2;
            color: #991b1b;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 16px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="main-card">
    <header>
        <h1>تطبيق تسميع القرآن الكريم التفاعلي المباشر</h1>
    </header>

    <div class="control-grid">
        <div class="form-group">
            <label for="surahSelect">اختر السورة المباركة:</label>
            <select id="surahSelect" onchange="QuranApp.onSurahChanged()">
                <option value="">جاري تحميل السور...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="startAyahSelect">ابدأ من الآية:</label>
            <select id="startAyahSelect" onchange="QuranApp.renderText()">
                <option value="1">1</option>
            </select>
        </div>
    </div>

    <div class="quran-container" id="quranText">
        الرجاء اختيار سورة من القائمة للبدء...
    </div>

    <div class="status-badge" id="statusIndicator">
        🔴 جاري الاستماع... اتلُ الآيات بالترتيب وستفتح الكلمات واحدة تلو الأخرى
    </div>

    <div class="action-bar">
        <button id="startBtn" class="btn btn-start" onclick="QuranApp.startRecitation()" disabled>
            <i class="fa-solid fa-microphone"></i> <span>ابدأ التسميع</span>
        </button>
        <button id="stopBtn" class="btn btn-stop" onclick="QuranApp.stopRecitation()" disabled>
            <i class="fa-solid fa-square"></i> <span>إنهاء والتقييم النهائي</span>
        </button>
    </div>

    <div class="results-panel" id="resultsPanel">
        <div class="score-display" id="scoreDisplay">%0</div>
        <div class="feedback-text" id="feedbackDisplay" style="text-align:center; font-weight:bold; margin-top:10px;"></div>
        <h4 style="margin-top:15px;">الكلمات التي تحتاج إلى مراجعة:</h4>
        <ul id="errorList" class="error-tag-list"></ul>
    </div>
</div>

<script>
const QuranApp = (function() {
    let state = {
        surahAyahs: [],
        isListening: false,
        fullTranscribedSpeech: "",
        wordsMap: [], 
        currentExpectedIndex: 0, // SADECE SIRADAKİ KELİMEYİ TAKİP EDEN İNDEKS
        recognitionInstance: null
    };

    function normalizeArabic(text) {
        if (!text) return "";
        return text
            .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
            .replace(/[﴿﴾0-9\(\)\[\]\{\}\.\,\;\:\-\_\"\']/g, '')
            .replace(/[أإآٱ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'ء')
            .replace(/ئ/g, 'ء')
            .replace(/ة/g, 'ه')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function calculateLevenshtein(a, b) {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) matrix[i] = [i];
        for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

        for (let i = 1; i <= b.length; i++) {
            for (let j = 1; j <= a.length; j++) {
                if (b.charAt(i - 1) === a.charAt(j - 1)) {
                    matrix[i][j] = matrix[i - 1][j - 1];
                } else {
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j - 1] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j] + 1
                    );
                }
            }
        }
        return matrix[b.length][a.length];
    }

    function isWordMatch(w1, w2) {
        if (!w1 || !w2) return false;
        if (w1 === w2) return true;
        if (Math.abs(w1.length - w2.length) > 2) return false;
        const dist = calculateLevenshtein(w1, w2);
        return (dist / Math.max(w1.length, w2.length)) <= 0.25;
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("المتصفح لا يدعم التسميع الصوتي المباشر.");
            return;
        }

        state.recognitionInstance = new SpeechRecognition();
        state.recognitionInstance.continuous = true;
        state.recognitionInstance.interimResults = true;
        state.recognitionInstance.lang = 'ar-SA';

        state.recognitionInstance.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    state.fullTranscribedSpeech += ' ' + event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            const currentLiveText = state.fullTranscribedSpeech + ' ' + interimTranscript;
            processStrictSequentialMatching(currentLiveText);
        };

        state.recognitionInstance.onend = () => {
            if (state.isListening) {
                try { state.recognitionInstance.start(); } catch(e){}
            }
        };
    }

    /**
     * SADECE VE SADECE SIRADAKİ KELİMELERİ SIFIR HATA İLE AÇAN SIRALI MOTOR
     */
    function processStrictSequentialMatching(speechText) {
        const cleanSpeech = normalizeArabic(speechText);
        if (!cleanSpeech) return;

        const spokenWords = cleanSpeech.split(' ').filter(w => w.length > 0);
        if (spokenWords.length === 0) return;

        // Okunan son 6 kelimelik parçaya bak
        const recentSpoken = spokenWords.slice(-6);

        // Sıradaki 3 kelimelik pencereye izin ver (Ufak atlamalara esneklik için)
        let maxSearchAhead = Math.min(state.currentExpectedIndex + 3, state.wordsMap.length);

        for (let i = state.currentExpectedIndex; i < maxSearchAhead; i++) {
            const item = state.wordsMap[i];
            if (!item || item.isRevealed) continue;

            const matched = recentSpoken.some(spkWd => isWordMatch(item.cleanWord, spkWd));

            if (matched) {
                // Arada atlanan kelimeler varsa onları da sırayla aç
                for (let k = state.currentExpectedIndex; k <= i; k++) {
                    if (state.wordsMap[k] && !state.wordsMap[k].isRevealed) {
                        state.wordsMap[k].isRevealed = true;
                        state.wordsMap[k].element.classList.add('revealed');
                    }
                }

                state.currentExpectedIndex = i + 1;
                item.element.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
                break;
            }
        }
    }

    async function fetchSurahList() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            const selectEl = document.getElementById('surahSelect');
            selectEl.innerHTML = '<option value="">-- اختر السورة المباركة --</option>';
            data.data.forEach(surah => {
                selectEl.innerHTML += `<option value="${surah.number}">${surah.number}. سورة ${surah.name}</option>`;
            });
        } catch (e) {
            alert('خطأ في تحميل السور.');
        }
    }

    return {
        init: function() {
            initSpeechRecognition();
            fetchSurahList();
        },

        onSurahChanged: async function() {
            const surahNum = document.getElementById('surahSelect').value;
            if (!surahNum) return;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
                const data = await res.json();
                state.surahAyahs = data.data.ayahs;

                const startSelect = document.getElementById('startAyahSelect');
                startSelect.innerHTML = '';
                state.surahAyahs.forEach(a => {
                    startSelect.innerHTML += `<option value="${a.numberInSurah}">الآية ${a.numberInSurah}</option>`;
                });

                this.renderText();
                document.getElementById('startBtn').disabled = false;
            } catch (e) {
                alert('خطأ في تحميل نص السورة.');
            }
        },

        renderText: function() {
            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const quranContainer = document.getElementById('quranText');
            quranContainer.innerHTML = '';

            state.wordsMap = [];
            state.currentExpectedIndex = 0;

            state.surahAyahs.forEach(ayah => {
                const isBeforeStart = ayah.numberInSurah < startAyah;
                const rawWords = ayah.text.split(/\s+/);

                rawWords.forEach(w => {
                    const cleanW = normalizeArabic(w);
                    const wordSpan = document.createElement('span');
                    wordSpan.className = `q-word ${isBeforeStart ? 'revealed' : ''}`;
                    wordSpan.innerText = w;
                    
                    quranContainer.appendChild(wordSpan);

                    if (!isBeforeStart) {
                        state.wordsMap.push({
                            cleanWord: cleanW,
                            element: wordSpan,
                            isRevealed: false
                        });
                    }
                });

                const ayahNumSpan = document.createElement('span');
                ayahNumSpan.className = 'verse-num';
                ayahNumSpan.innerText = ` ﴿${ayah.numberInSurah}﴾ `;
                quranContainer.appendChild(ayahNumSpan);
            });
        },

        startRecitation: function() {
            if (!state.recognitionInstance) return;

            state.fullTranscribedSpeech = "";
            state.isListening = true;

            document.getElementById('resultsPanel').style.display = 'none';
            document.getElementById('statusIndicator').style.display = 'block';

            try { state.recognitionInstance.start(); } catch(e){}

            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('surahSelect').disabled = true;
            document.getElementById('startAyahSelect').disabled = true;
        },

        stopRecitation: async function() {
            state.isListening = false;
            if (state.recognitionInstance) state.recognitionInstance.stop();

            document.getElementById('statusIndicator').style.display = 'none';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('surahSelect').disabled = false;
            document.getElementById('startAyahSelect').disabled = false;

            const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
            const relevantAyahs = state.surahAyahs.filter(a => a.numberInSurah >= startAyah);
            const originalText = relevantAyahs.map(a => a.text).join(' ');

            try {
                const res = await fetch('/api/analyze-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        originalText: originalText,
                        transcribedText: state.fullTranscribedSpeech
                    })
                });

                const result = await res.json();
                if (result.success) {
                    this.displayResults(result.data);
                }
            } catch (e) {
                alert('حدث خطأ أثناء التقييم.');
            }
        },

        displayResults: function(data) {
            document.getElementById('scoreDisplay').innerText = `%${data.accuracy_percentage}`;
            document.getElementById('feedbackDisplay').innerText = data.feedback_ar;

            const errorList = document.getElementById('errorList');
            errorList.innerHTML = '';

            if (data.missing_or_wrong_words && data.missing_or_wrong_words.length > 0) {
                data.missing_or_wrong_words.forEach(word => {
                    const li = document.createElement('li');
                    li.innerText = word;
                    errorList.appendChild(li);
                });
            } else {
                errorList.innerHTML = '<li style="background:#f0fdf4; color:#166534; border-color:#bbf7d0;">ما شاء الله! التلاوة ممتازة ومتقنة للغاية.</li>';
            }

            document.getElementById('resultsPanel').style.display = 'block';
        }
    };
})();

window.addEventListener('DOMContentLoaded', () => {
    QuranApp.init();
});
</script>
</body>
</html>
