<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة التسميع التفاعلي المباشر</title>
    
    <!-- Google tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BS0LYX8BTM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BS0LYX8BTM');
    </script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --card-bg: rgba(18, 26, 47, 0.95);
            --border-color: rgba(212, 163, 38, 0.2);
            --border-hover: rgba(212, 163, 38, 0.5);
            --gold-accent: #d4a326;
            --gold-glow: rgba(212, 163, 38, 0.15);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --word-blur-bg: #1e293b;
            --word-revealed: #ffe082;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 163, 38, 0.08) 0%, transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(15, 23, 42, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
        }

        /* HEADER SECTION */
        header { text-align: center; margin-bottom: 28px; }
        .title-badge {
            display: inline-block;
            padding: 6px 16px;
            background: var(--gold-glow);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--gold-accent);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        header h1 {
            font-size: 30px;
            color: var(--text-primary);
            font-weight: 700;
            line-height: 1.3;
        }

        /* CONTROL GRID (MOBILE RESPONSIVE) */
        .control-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .control-grid {
                grid-template-columns: 1fr;
            }
            .app-container {
                padding: 20px 14px;
                border-radius: 18px;
            }
            header h1 { font-size: 24px; }
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 14px 16px;
            background: #0d1322;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-family: 'Amiri', serif;
            font-size: 18px;
            outline: none;
            transition: all 0.25s ease;
        }

        select:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        /* QURAN DISPLAY CONTAINER */
        .quran-viewport {
            background: #080c17;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 32px 24px;
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            line-height: 2.7;
            text-align: justify;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 24px;
            scroll-behavior: smooth;
            word-spacing: 3px;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 640px) {
            .quran-viewport {
                font-size: 22px;
                line-height: 2.4;
                padding: 20px 14px;
                max-height: 350px;
            }
        }

        /* KELİME STİLLERİ */
        .q-word {
            display: inline-block;
            transition: filter 0.3s ease, opacity 0.3s ease, transform 0.2s ease;
            filter: blur(9px);
            opacity: 0.12;
            user-select: none;
            background: var(--word-blur-bg);
            border-radius: 6px;
            padding: 0 6px;
            margin: 0 2px;
        }

        .q-word.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background: transparent;
            color: var(--word-revealed);
            text-shadow: 0 0 10px rgba(255, 224, 130, 0.2);
        }

        .verse-num {
            display: inline-block;
            color: var(--gold-accent);
            font-size: 22px;
            margin: 0 8px;
            opacity: 0.85;
        }

        /* ACTION BUTTONS */
        .action-bar {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 200px;
            padding: 16px 28px;
            border-radius: 14px;
            font-family: 'Amiri', serif;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-start {
            background: linear-gradient(135deg, #d4a326 0%, #b48310 100%);
            color: #000;
        }
    </style>
</head>
<body>
    <!-- Site içeriğin buraya gelecek -->
</body>
</html>
