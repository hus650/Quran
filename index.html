<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تسميع القرآن الكريم المباشر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --g1: #fffdf0; --g2: #fef4c5; --g3: #f8d763; --g4: #d4a326;
            --g5: #996515; --g6: #5c3a08; --danger-color: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, #eed054 0%, #d4a326 50%, #996515 100%);
            background-attachment: fixed;
            color: var(--g6);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.96);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 2px solid var(--g3);
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--g6); font-size: 32px; }

        .select-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--g3);
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Amiri', serif;
            background: var(--g1);
            color: var(--g6);
            outline: none;
        }

        /* DOGRUDAN ANA METIN KUTUSU */
        .quran-box {
            background: #ffffff;
            border: 2px solid var(--g3);
            padding: 30px;
            border-radius: 20px;
            font-family: 'Amiri Quran', serif;
            font-size: 28px;
            line-height: 2.6;
            text-align: justify;
            max-height: 420px;
            overflow-y: auto;
            margin-bottom: 25px;
            position: relative;
        }

        /* AYETLERIN CANLI ACILMA STILI */
        .verse {
            display: inline;
            transition: all 0.4s ease;
            filter: blur(10px);
            opacity: 0.12;
            user-select: none;
            background-color: var(--g2);
            border-radius: 6px;
            padding: 2px 6px;
        }

        .verse.revealed {
            filter: blur(0);
            opacity: 1;
            user-select: text;
            background-color: transparent;
            color: var(--g6);
            animation: goldFlash 0.8s ease-out;
        }

        @keyframes goldFlash {
            0% { background-color: var(--g3); }
            100% { background-color: transparent; }
        }

        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 15px; }

        button.main-btn {
            padding: 14px 32px;
            font-size: 19px;
            font-weight: bold;
            font-family: 'Amiri', serif;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
        }

        .btn-start { background: var(--g4); color: white; }
        .btn-start:hover { background: var(--g5); }
        .btn-stop { background: var(--danger-color); color: white; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .recording-indicator {
            display: none;
            text-align: center;
            color: var(--danger-color);
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 18px;
            background: var(--g1);
            border: 2px solid var(--g3);
        }

        .score-value { font-size: 52px; font-weight: bold; color: var(--g5); text-align: center; font-family: 'Plus Jakarta Sans', sans-serif; }
        ul.error-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        ul.error-list li { background: #fef2f2; color: #991b1b; padding: 6px 14px; border-radius: 8px; font-size: 16px; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>تطبيق تسميع القرآن الكريم المباشر</h1>
    </header>

    <div class="select-grid">
        <div>
            <label>اختر السورة المباركة:</label>
            <select id="surahSelect" onchange="loadSurahDetails()">
                <option value="">جاري تحميل القائمة...</option>
            </select>
        </div>
        <div>
            <label>ابدأ من الآية:</label>
            <select id="startAyahSelect" onchange="renderSurahText()">
                <option value="1">1</option>
            </select>
        </div>
    </div>

    <div class="quran-box" id="quranText">
        الرجاء اختيار سورة لبدء التسميع...
    </div>

    <div class="recording-indicator" id="recIndicator">
        🔴 جاري الاستماع لقراءتك مباشرة... اتلُ الآيات المباركة
    </div>

    <div class="controls">
        <button id="startBtn" class="main-btn btn-start" onclick="startLiveRecognition()" disabled>
            <i class="fa-solid fa-microphone"></i> <span>ابدأ التسميع</span>
        </button>
        <button id="stopBtn" class="main-btn btn-stop" onclick="stopLiveRecognition()" disabled>
            <i class="fa-solid fa-square"></i> <span>إنهاء والتقييم النهائي</span>
        </button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="score-value" id="scoreValue">0%</div>
        <p id="feedbackText" style="margin-top:10px; font-weight:bold; text-align:center;"></p>
        <h4 style="margin-top:15px;">الكلمات الخاطئة أو المفقودة:</h4>
        <ul id="errorList" class="error-list"></ul>
    </div>
</div>

<script>
    let surahAyahs = [];
    let recognition = null;
    let isListening = false;
    let fullTranscribedSpeech = "";

    // Arapça metin temizleme helper
    function cleanArabic(text) {
        return text
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[﴿﴾0-9]/g, '')
            .replace(/[^\u0600-\u06FF\s]/g, '')
            .trim();
    }

    // Web Speech API Kurulumu
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ar-SA';

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    fullTranscribedSpeech += ' ' + event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            const liveText = fullTranscribedSpeech + ' ' + interimTranscript;
            // CANLI AÇMA: Sadece ana ayet kutusundaki görünümü günceller
            processLiveReveal(liveText);
        };

        recognition.onend = () => {
            // Eğer kullanıcı stop butonuna basmadıysa konuşma durduğunda otomatik tekrar başlat (Bug önleme)
            if (isListening) {
                try { recognition.start(); } catch(e){}
            }
        };
    } else {
        alert("متصفحك لا يدعم التعرف الصوتي المباشر. يرجى استخدام متصفح Chrome.");
    }

    async function loadSurahs() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            const select = document.getElementById('surahSelect');
            select.innerHTML = '<option value="">-- اختر السورة --</option>';
            data.data.forEach(surah => {
                select.innerHTML += `<option value="${surah.number}">${surah.number}. سورة ${surah.name}</option>`;
            });
        } catch (e) {
            alert('خطأ في تحميل قائمة السور.');
        }
    }

    async function loadSurahDetails() {
        const surahNum = document.getElementById('surahSelect').value;
        if (!surahNum) return;

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
            const data = await res.json();
            surahAyahs = data.data.ayahs;

            // Başlangıç Ayeti Seçimi
            const startSelect = document.getElementById('startAyahSelect');
            startSelect.innerHTML = '';
            surahAyahs.forEach(a => {
                startSelect.innerHTML += `<option value="${a.numberInSurah}">الآية ${a.numberInSurah}</option>`;
            });

            renderSurahText();
            document.getElementById('startBtn').disabled = false;
        } catch (e) {
            alert('خطأ في تحميل نص السورة');
        }
    }

    function renderSurahText() {
        const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
        const quranBox = document.getElementById('quranText');

        // Seçilen ayetten öncesi görünür, seçilen ve sonrası flu açılacak şekilde yüklenir
        quranBox.innerHTML = surahAyahs.map(a => {
            const isBeforeStart = a.numberInSurah < startAyah;
            return `<span class="verse ${isBeforeStart ? 'revealed' : ''}" id="verse-${a.numberInSurah}">${a.text} ﴿${a.numberInSurah}﴾</span>`;
        }).join(' ');
    }

    // CANLI KELİME KONTROLÜ VE ANINDA METİN AÇMA
    function processLiveReveal(speechText) {
        const cleanSpeech = cleanArabic(speechText);
        if (!cleanSpeech) return;

        const speechWords = cleanSpeech.split(/\s+/);

        surahAyahs.forEach(a => {
            const el = document.getElementById(`verse-${a.numberInSurah}`);
            if (el && !el.classList.contains('revealed')) {
                const cleanAyah = cleanArabic(a.text);
                const ayahWords = cleanAyah.split(/\s+/);
                
                // Ayet kelimelerinin canlı konuşma içindeki eşleşme sayısını bul
                let matchCount = 0;
                ayahWords.forEach(w => {
                    if (speechWords.includes(w)) matchCount++;
                });

                // Eğer ayetin %40'ından fazlası telaffuz edildiyse ayet görünür hale gelir
                if (matchCount >= Math.ceil(ayahWords.length * 0.4)) {
                    el.classList.add('revealed');
                }
            }
        });
    }

    function startLiveRecognition() {
        if (!recognition) return;

        fullTranscribedSpeech = "";
        isListening = true;
        
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('recIndicator').style.display = 'block';
        
        try { recognition.start(); } catch(e){}

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('surahSelect').disabled = true;
        document.getElementById('startAyahSelect').disabled = true;
    }

    async function stopLiveRecognition() {
        isListening = false;
        if (recognition) recognition.stop();

        document.getElementById('recIndicator').style.display = 'none';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('surahSelect').disabled = false;
        document.getElementById('startAyahSelect').disabled = false;

        // Başlangıç Ayetinden itibaren olan orijinal metni hazırla
        const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
        const relevantAyahs = surahAyahs.filter(a => a.numberInSurah >= startAyah);
        const originalText = relevantAyahs.map(a => `${a.text} ﴿${a.numberInSurah}﴾`).join(' ');

        // Sunucudan Analiz İste
        try {
            const res = await fetch('/api/analyze-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    originalText: originalText,
                    transcribedText: fullTranscribedSpeech
                })
            });

            const result = await res.json();
            if (result.success) {
                showFinalResults(result.data);
            }
        } catch (e) {
            alert('حدث خطأ أثناء التقييم النهائي.');
        }
    }

    function showFinalResults(data) {
        document.getElementById('scoreValue').innerText = `%${data.accuracy_percentage}`;
        document.getElementById('feedbackText').innerText = data.feedback_ar;

        const errorList = document.getElementById('errorList');
        errorList.innerHTML = '';

        if (data.missing_or_wrong_words && data.missing_or_wrong_words.length > 0) {
            data.missing_or_wrong_words.forEach(w => {
                errorList.innerHTML += `<li>${w}</li>`;
            });
        } else {
            errorList.innerHTML = '<li style="background:#f0fdf4; color:#166534; border-color:#bbf7d0;">ما شاء الله! القراءة متقنة تماماً بدون أخطاء.</li>';
        }

        document.getElementById('resultBox').style.display = 'block';
    }

    loadSurahs();
</script>
</body>
</html>
