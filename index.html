<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق اختبار وتسميع القرآن الكريم VIP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --g1: #fffdf0; --g2: #fffae0; --g3: #fef4c5; --g4: #fce895; --g5: #f8d763;
            --g6: #eed054; --g7: #e5b83b; --g8: #d4a326; --g9: #b8860b; --g10: #996515;
            --g11: #784e10; --g12: #5c3a08; --g13: #422803; --g14: #fff7d6;
            --danger-color: #dc2626; --card-bg: rgba(255, 255, 255, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Amiri', serif;
            background: linear-gradient(135deg, var(--g6) 0%, var(--g8) 50%, var(--g10) 100%);
            background-attachment: fixed;
            color: var(--g13);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border: 2px solid var(--g6);
        }

        header { text-align: center; margin-bottom: 25px; }
        h1 { color: var(--g12); font-size: 32px; }
        p.subtitle { color: var(--g11); font-size: 18px; }

        .select-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--g6);
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Amiri', serif;
            background: var(--g1);
            color: var(--g13);
            outline: none;
        }

        .live-transcript-box {
            background: #1e293b;
            color: #38bdf8;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            min-height: 60px;
            margin-bottom: 20px;
            direction: rtl;
        }

        .quran-box {
            background: #ffffff;
            border: 2px solid var(--g5);
            padding: 30px;
            border-radius: 20px;
            font-family: 'Amiri Quran', serif;
            font-size: 26px;
            line-height: 2.5;
            text-align: justify;
            max-height: 380px;
            overflow-y: auto;
            margin-bottom: 25px;
        }

        .verse {
            display: inline;
            transition: all 0.5s ease;
            filter: blur(10px);
            opacity: 0.15;
            user-select: none;
            background-color: var(--g4);
            border-radius: 6px;
            padding: 2px 4px;
        }

        .verse.revealed {
            filter: blur(0);
            opacity: 1;
            background-color: transparent;
            color: var(--g13);
            animation: glow 1s ease-out;
        }

        @keyframes glow {
            0% { background-color: var(--g5); }
            100% { background-color: transparent; }
        }

        .controls { display: flex; gap: 15px; justify-content: center; margin-bottom: 20px; }

        button.main-btn {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Amiri', serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-start { background: var(--g8); color: white; }
        .btn-stop { background: var(--danger-color); color: white; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .result-box {
            display: none;
            margin-top: 25px;
            padding: 25px;
            border-radius: 16px;
            background: #ffffff;
            border: 2px solid var(--g5);
        }

        .score-value { font-size: 48px; font-weight: bold; color: var(--g10); text-align: center; }
        ul.error-list { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        ul.error-list li { background: #fef2f2; color: #991b1b; padding: 5px 12px; border-radius: 8px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>تطبيق اختبار وتسميع القرآن الكريم</h1>
        <p class="subtitle">تسميع حي ومباشر مع الذكاء الاصطناعي</p>
    </header>

    <div class="select-grid">
        <div>
            <label>اختر السورة المباركة:</label>
            <select id="surahSelect" onchange="loadSurahDetails()">
                <option value="">جاري تحميل القائمة...</option>
            </select>
        </div>
        <div>
            <label>ابدأ من الآية:</label>
            <select id="startAyahSelect" onchange="renderSurahText()">
                <option value="1">1</option>
            </select>
        </div>
    </div>

    <div class="live-transcript-box" id="liveTranscript">
        🎙️ النص المسموع مباشر سيظهر هنا أثناء كلامك...
    </div>

    <div class="quran-box" id="quranText">
        الرجاء اختيار سورة لبدء التسميع...
    </div>

    <div class="controls">
        <button id="startBtn" class="main-btn btn-start" onclick="startLiveRecognition()" disabled>
            <i class="fa-solid fa-microphone"></i> <span>ابدأ التسميع المباشر</span>
        </button>
        <button id="stopBtn" class="main-btn btn-stop" onclick="stopLiveRecognition()" disabled>
            <i class="fa-solid fa-square"></i> <span>إنهاء والتقييم النهائي</span>
        </button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="score-value" id="scoreValue">0%</div>
        <p id="feedbackText" style="margin-top:10px; font-weight:bold;"></p>
        <h4 style="margin-top:15px;">الكلمات الخاطئة أو المفقودة:</h4>
        <ul id="errorList" class="error-list"></ul>
    </div>
</div>

<script>
    let surahAyahs = [];
    let recognition;
    let fullTranscribedSpeech = "";

    // Web Speech API Kurulumu (Canlı Ses Tanıma)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ar-SA'; // Arapça Canlı Algılama

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    fullTranscribedSpeech += ' ' + event.results[i][0].transcript;
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            
            const currentLiveText = fullTranscribedSpeech + ' ' + interimTranscript;
            document.getElementById('liveTranscript').innerText = currentLiveText;

            // CANLI AÇMA SİHRİ: Okunan kelimeleri anında eşleştir ve ayetleri aç!
            checkAndRevealLive(currentLiveText);
        };

        recognition.onerror = (err) => {
            console.error("Speech Error:", err);
        };
    } else {
        alert("متصفحك لا يدعم خاصية التعرف الصوتي المباشر. يرجى استخدام Google Chrome.");
    }

    async function loadSurahs() {
        try {
            const res = await fetch('https://api.alquran.cloud/v1/surah');
            const data = await res.json();
            const select = document.getElementById('surahSelect');
            select.innerHTML = '<option value="">-- اختر السورة --</option>';
            data.data.forEach(surah => {
                select.innerHTML += `<option value="${surah.number}">${surah.number}. سورة ${surah.name}</option>`;
            });
        } catch (e) {
            alert('خطأ في تحميل السور');
        }
    }

    async function loadSurahDetails() {
        const surahNum = document.getElementById('surahSelect').value;
        if (!surahNum) return;

        try {
            const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}/quran-uthmani`);
            const data = await res.json();
            surahAyahs = data.data.ayahs;

            // Ayet Seçim Kutusunu Doldur
            const startSelect = document.getElementById('startAyahSelect');
            startSelect.innerHTML = '';
            surahAyahs.forEach(a => {
                startSelect.innerHTML += `<option value="${a.numberInSurah}">الآية ${a.numberInSurah}</option>`;
            });

            renderSurahText();
            document.getElementById('startBtn').disabled = false;
        } catch (e) {
            alert('خطأ في تحميل نص السورة');
        }
    }

    function renderSurahText() {
        const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
        const quranBox = document.getElementById('quranText');

        // Kullanıcının seçtiği ayetten öncesi görünür/muaf, sonrası gizli render edilir
        quranBox.innerHTML = surahAyahs.map(a => {
            const isBeforeStart = a.numberInSurah < startAyah;
            return `<span class="verse ${isBeforeStart ? 'revealed' : ''}" id="verse-${a.numberInSurah}">${a.text} ﴿${a.numberInSurah}﴾</span>`;
        }).join(' ');
    }

    // CANLI KELİME KONTROLÜ VE ANINDA AÇMA
    function checkAndRevealLive(speechText) {
        const cleanSpeech = speechText.replace(/[^\u0600-\u06FF\s]/g, ''); // Sadece Arapça harfler
        
        surahAyahs.forEach(a => {
            const cleanAyah = a.text.replace(/[^\u0600-\u06FF\s]/g, '');
            // Eğer okunan canlı metin içinde ayetin kelimelerinin büyük kısmı geçiyorsa aç
            const words = cleanAyah.split(' ').filter(w => w.length > 2);
            let matchCount = 0;
            
            words.forEach(w => {
                if (cleanSpeech.includes(w)) matchCount++;
            });

            if (matchCount >= Math.ceil(words.length * 0.5)) {
                const el = document.getElementById(`verse-${a.numberInSurah}`);
                if (el && !el.classList.contains('revealed')) {
                    el.classList.add('revealed');
                }
            }
        });
    }

    function startLiveRecognition() {
        fullTranscribedSpeech = "";
        document.getElementById('liveTranscript').innerText = "جاري الاستماع... ابدأ القراءة الآن";
        document.getElementById('resultBox').style.display = 'none';
        
        recognition.start();

        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('surahSelect').disabled = true;
        document.getElementById('startAyahSelect').disabled = true;
    }

    async function stopLiveRecognition() {
        recognition.stop();
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('surahSelect').disabled = false;
        document.getElementById('startAyahSelect').disabled = false;

        // LLM Sunucusuna Doğrulama Talebi
        const startAyah = parseInt(document.getElementById('startAyahSelect').value) || 1;
        const relevantAyahs = surahAyahs.filter(a => a.numberInSurah >= startAyah);
        const originalText = relevantAyahs.map(a => `${a.text} ﴿${a.numberInSurah}﴾`).join(' ');

        document.getElementById('liveTranscript').innerText = "جاري إرسال النص للتحليل النهائي...";

        try {
            const res = await fetch('/api/analyze-text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    originalText: originalText,
                    transcribedText: fullTranscribedSpeech
                })
            });

            const result = await res.json();
            if (result.success) {
                showFinalResults(result.data);
            }
        } catch (e) {
            alert('خطأ أثناء التقييم النهائي.');
        }
    }

    function showFinalResults(data) {
        document.getElementById('scoreValue').innerText = `%${data.accuracy_percentage}`;
        document.getElementById('feedbackText').innerText = data.feedback_ar;

        const errorList = document.getElementById('errorList');
        errorList.innerHTML = '';

        if (data.missing_or_wrong_words && data.missing_or_wrong_words.length > 0) {
            data.missing_or_wrong_words.forEach(w => {
                errorList.innerHTML += `<li>${w}</li>`;
            });
        } else {
            errorList.innerHTML = '<li>ما شاء الله! القراءة متقنة تماماً بدون أخطاء.</li>';
        }

        document.getElementById('resultBox').style.display = 'block';
    }

    loadSurahs();
</script>
</body>
</html>
